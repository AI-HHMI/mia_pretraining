name: Add a dataset or a crop to the data collection
description: Ask for a volume (or a crop of one) to be ingested into the data collection
title: "<Project> - <dataset name>"
body:
  - type: markdown
    attributes:
      value: |
        **How this form works**
        1. Fill the fields below. The ones marked required must be filled before you can submit. The grey text in a box shows the exact format to use.
        2. Submit. The automation reads your answers as written, so please keep the formats (for example `Z[start:end], Y[start:end], X[start:end]`).
        3. Then I read the volume, post what I found and the proposed crop on the issue, and the ingestion starts after the approver says yes.
        Questions about a field: ask in the comments or tag @dchen116.

  - type: input
    id: source
    attributes:
      label: Source (cluster path to the volume)
      placeholder: "/groups/tavakoli/tavakolilab/<folder>/fused.ome.zarr"
    validations:
      required: true
  - type: dropdown
    id: modality
    attributes:
      label: Modality
      options:
        - Expansion microscopy (ExM)
        - Light microscopy (LM)
        - Electron microscopy (EM)
        - Micro-CT
        - Other (say which in the notes)
    validations:
      required: true
  - type: dropdown
    id: organism
    attributes:
      label: Organism
      options:
        - Drosophila
        - Mouse
        - Zebrafish
        - Human
        - Other (say which in the notes)
    validations:
      required: true
  - type: input
    id: expansion
    attributes:
      label: Expansion factor
      placeholder: "none, or for example 16x"
    validations:
      required: true
  - type: textarea
    id: bbox
    attributes:
      label: Crop (box to ingest)
      description: A Neuroglancer link to the box, or `Z[a:b], Y[a:b], X[a:b]` and the grid they are in. Write "the whole volume" if it is small.
    validations:
      required: true
  - type: input
    id: replaces
    attributes:
      label: Replaces (issue number, only when this volume takes the place of an earlier dataset)
      placeholder: "#456"
  - type: textarea
    id: publication
    attributes:
      label: License and publication (optional)
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
